name: flutter_app
description: "Starlight Terminal - a starlit TUI console for sky observations."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  http: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Light.ttf
          weight: 300
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    # Glyph fallback. JetBrains Mono has no star, gear, hexagon or quarter-disc
    # glyphs, and on the web there is no OS font to fall back to — missing
    # characters render as tofu boxes. DejaVu Sans Mono covers nearly the whole
    # Unicode geometric/technical block, so the terminal chrome always draws.
    - family: MonoFallback
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
          weight: 400
        - asset: assets/fonts/DejaVuSansMono-Bold.ttf
          weight: 700
